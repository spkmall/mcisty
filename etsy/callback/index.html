<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; manifest-src 'none'; worker-src 'none'">
  <title>MCISTY Etsy Callback</title>
  <style>
    :root {
      --navy: #101c2f;
      --navy-deep: #07111f;
      --cream: #f4efe4;
      --cream-muted: #cfc4b0;
      --gold: #b8954a;
      --gold-soft: #d8bd78;
      --line: rgba(244, 239, 228, 0.18);
      --panel: rgba(255, 255, 255, 0.045);
      --danger: #d4937f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--navy-deep);
      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .shell {
      width: min(100%, 680px);
      border: 1px solid var(--line);
      background: var(--navy);
      padding: clamp(24px, 6vw, 46px);
    }

    .brand {
      margin: 0 0 18px;
      color: var(--gold-soft);
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 3.15rem);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: 0;
    }

    p {
      margin: 18px 0 0;
      color: var(--cream-muted);
      font-size: 1rem;
    }

    .notice {
      margin-top: 26px;
      border-left: 3px solid var(--gold);
      padding: 14px 0 14px 18px;
      background: var(--panel);
    }

    .notice.error {
      border-left-color: var(--danger);
    }

    .field {
      margin-top: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--gold-soft);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 86px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 0;
      background: rgba(0, 0, 0, 0.22);
      color: var(--cream);
      padding: 12px;
      font: 0.95rem/1.45 Consolas, "Courier New", monospace;
    }

    button {
      margin-top: 10px;
      border: 1px solid var(--gold);
      border-radius: 0;
      background: transparent;
      color: var(--cream);
      cursor: pointer;
      font: 700 0.76rem/1 Arial, Helvetica, sans-serif;
      letter-spacing: 0.14em;
      padding: 12px 14px;
      text-transform: uppercase;
    }

    button:hover,
    button:focus {
      background: var(--gold);
      color: var(--navy-deep);
      outline: none;
    }

    .status {
      display: inline-block;
      margin-left: 10px;
      color: var(--cream-muted);
      font-size: 0.85rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-live="polite">
      <p class="brand">MCISTY Etsy Manager</p>
      <h1 id="title">MCISTY Etsy callback is ready.</h1>
      <div id="message" class="notice">
        <p>This page is waiting for Etsy to return authorization details.</p>
      </div>

      <div id="success" class="hidden">
        <p>Return the authorization code and state to the local MCISTY Etsy Manager.</p>

        <div class="field">
          <label for="codeValue">Authorization code</label>
          <textarea id="codeValue" readonly></textarea>
          <button type="button" data-copy-target="codeValue">Copy code</button>
          <span class="status" id="codeValueStatus" role="status"></span>
        </div>

        <div class="field">
          <label for="stateValue">State</label>
          <textarea id="stateValue" readonly></textarea>
          <button type="button" data-copy-target="stateValue">Copy state</button>
          <span class="status" id="stateValueStatus" role="status"></span>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var state = params.get("state");
      var error = params.get("error");
      var errorDescription = params.get("error_description");

      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var success = document.getElementById("success");
      var codeValue = document.getElementById("codeValue");
      var stateValue = document.getElementById("stateValue");

      function setMessage(text, isError) {
        message.textContent = "";
        var paragraph = document.createElement("p");
        paragraph.textContent = text;
        message.appendChild(paragraph);
        message.className = isError ? "notice error" : "notice";
      }

      if (error || errorDescription) {
        title.textContent = "Etsy authorization could not be completed.";
        setMessage(errorDescription || error || "Etsy returned an authorization error.", true);
      } else if (code && state) {
        title.textContent = "Etsy authorization received.";
        setMessage("No information on this page is sent or stored. Use the copy buttons below, then return to the local MCISTY Etsy Manager.", false);
        codeValue.value = code;
        stateValue.value = state;
        success.className = "";
      }

      function copyText(targetId) {
        var field = document.getElementById(targetId);
        var status = document.getElementById(targetId + "Status");
        var text = field.value;

        function done(label) {
          status.textContent = label;
          window.setTimeout(function () {
            status.textContent = "";
          }, 2200);
        }

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(function () {
            done("Copied.");
          }, function () {
            done("Copy failed.");
          });
          return;
        }

        field.focus();
        field.select();

        try {
          document.execCommand("copy");
          done("Copied.");
        } catch (error) {
          done("Copy failed.");
        }
      }

      document.addEventListener("click", function (event) {
        var targetId = event.target.getAttribute("data-copy-target");
        if (targetId) {
          copyText(targetId);
        }
      });
    }());
  </script>
</body>
</html>
